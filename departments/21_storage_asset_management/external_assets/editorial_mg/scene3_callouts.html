<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Kohinoor Devanagari", "Devanagari Sangam MN", sans-serif;
    overflow: hidden;
  }
</style>
</head>
<body>
  
    <div style="position: absolute; width: 1080px; height: 1920px;">
      <!-- Left Gill -->
      <div style="position: absolute; top: 780px; left: 140px;">
        <div style="font-family: monospace; font-size: 15px; font-weight: 700; color: #FFD700; letter-spacing: 2px;">
          LEFT CTENIDIUM (GILL)
        </div>
        <div style="font-family: -apple-system, sans-serif; font-size: 20px; font-weight: 600; color: #FFFFFF;">
          बायाँ गलफड़ा (O₂ अवशोषण)
        </div>
        <div style="width: 140px; height: 1px; background: linear-gradient(90deg, #FFD700, transparent); margin-top: 4px;"></div>
      </div>

      <!-- Right Gill -->
      <div style="position: absolute; top: 780px; right: 140px; text-align: right;">
        <div style="font-family: monospace; font-size: 15px; font-weight: 700; color: #FFD700; letter-spacing: 2px;">
          RIGHT CTENIDIUM (GILL)
        </div>
        <div style="font-family: -apple-system, sans-serif; font-size: 20px; font-weight: 600; color: #FFFFFF;">
          दायाँ गलफड़ा (O₂ अवशोषण)
        </div>
        <div style="width: 140px; height: 1px; background: linear-gradient(90deg, transparent, #FFD700); margin-top: 4px; margin-left: auto;"></div>
      </div>

      <!-- Left Branchial Heart -->
      <div style="position: absolute; top: 1140px; left: 160px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 10px; height: 10px; background: #00F0FF; border-radius: 50%; box-shadow: 0 0 10px #00F0FF;"></div>
          <div style="font-family: monospace; font-size: 16px; font-weight: 700; color: #00F0FF; letter-spacing: 2px;">
            BRANCHIAL HEART 01
          </div>
        </div>
        <div style="font-family: -apple-system, sans-serif; font-size: 22px; font-weight: 600; color: #E2E8F0; margin-left: 20px; margin-top: 2px;">
          पहला ब्रैकियल दिल (60 BPM)
        </div>
      </div>

      <!-- Right Branchial Heart -->
      <div style="position: absolute; top: 1140px; right: 160px; text-align: right;">
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px;">
          <div style="font-family: monospace; font-size: 16px; font-weight: 700; color: #00F0FF; letter-spacing: 2px;">
            BRANCHIAL HEART 02
          </div>
          <div style="width: 10px; height: 10px; background: #00F0FF; border-radius: 50%; box-shadow: 0 0 10px #00F0FF;"></div>
        </div>
        <div style="font-family: -apple-system, sans-serif; font-size: 22px; font-weight: 600; color: #E2E8F0; margin-right: 20px; margin-top: 2px;">
          दूसरा ब्रैकियल दिल (60 BPM)
        </div>
      </div>
    </div>
    
</body>
</html>
