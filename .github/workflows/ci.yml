name: Studio CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Linting & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit

      - name: Static Formatting & Lint Check
        run: |
          python -m ruff check core departments tests

      - name: Security Vulnerability Scan (Bandit)
        run: |
          python -m bandit -r core departments -ll -x tests

  unit-tests:
    name: Unit Test Suite (249 Tests)
    runs-on: macos-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (Homebrew)
        run: |
          brew install ffmpeg libsndfile

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Unit Test Discovery
        run: |
          python -m unittest discover tests/unit/ -p "test_*.py" -v

  integration-tests:
    name: Cross-Department Integration & E2E
    runs-on: macos-latest
    needs: unit-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (Homebrew)
        run: |
          brew install ffmpeg libsndfile

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Integration Test Discovery
        run: |
          python -m unittest discover tests/integration/ -p "test_*.py" -v
